<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="pomBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#052e16" />
    </linearGradient>
    <linearGradient id="pomAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>
    <linearGradient id="spine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="600" height="800" fill="url(#pomBg)" />
  <rect x="0" y="0" width="30" height="800" fill="url(#spine)" />
  <line x1="30" y1="0" x2="30" y2="800" stroke="#047857" stroke-width="1" />

  <g transform="translate(60, 60)">
    <rect width="180" height="30" rx="15" fill="#065f46" opacity="0.8" />
    <text x="90" y="20" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#a7f3d0" text-anchor="middle" letter-spacing="1">FINANSIAL &amp; INVESTASI</text>
  </g>

  <text x="60" y="290" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="600" fill="#6ee7b7" letter-spacing="4">WEALTH &amp; DECISION MAKING</text>
  <text x="60" y="340" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-1">The Psychology</text>
  <text x="60" y="390" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-1">of Money</text>
  <text x="60" y="440" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="700" fill="url(#pomAccent)">Rahasia Abadi Kemakmuran</text>

  <text x="60" y="495" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="400" fill="#cbd5e1">
    <tspan x="60" dy="0">19 Pelajaran Berharga Mengenai Cara Manusia Mengelola,</tspan>
    <tspan x="60" dy="24">Melihat Risiko, dan Menjaga Kekayaan Finansial.</tspan>
  </text>

  <rect x="60" y="560" width="80" height="4" rx="2" fill="url(#pomAccent)" />

  <g transform="translate(60, 660)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="2">PENULIS</text>
    <text x="0" y="24" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Morgan Housel</text>
  </g>

  <g transform="translate(450, 680)">
    <text x="90" y="0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="end" letter-spacing="1">Bookil<tspan fill="#34d399">.</tspan></text>
    <text x="90" y="16" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="600" fill="#94a3b8" text-anchor="end" letter-spacing="1">FINANCE 2026</text>
  </g>
