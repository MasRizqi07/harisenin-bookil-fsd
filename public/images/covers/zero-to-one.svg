<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="zBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="zAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="spine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="600" height="800" fill="url(#zBg)" />
  <rect x="0" y="0" width="30" height="800" fill="url(#spine)" />
  <line x1="30" y1="0" x2="30" y2="800" stroke="#27272a" stroke-width="1" />

  <!-- Huge 0 -> 1 Graphic -->
  <g transform="translate(300, 360)" opacity="0.15">
    <text x="-80" y="40" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="200" font-weight="900" fill="#f59e0b" text-anchor="middle">0</text>
    <text x="80" y="40" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="200" font-weight="900" fill="#ef4444" text-anchor="middle">1</text>
  </g>

  <g transform="translate(60, 60)">
    <rect width="170" height="30" rx="15" fill="#78350f" opacity="0.8" />
    <text x="85" y="20" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#fde68a" text-anchor="middle" letter-spacing="1">BISNIS &amp; STARTUP</text>
  </g>

  <text x="60" y="300" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="600" fill="#fbbf24" letter-spacing="4">VENTURE CAPITAL CLASSIC</text>
  <text x="60" y="360" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1">Zero to One</text>
  <text x="60" y="415" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="700" fill="url(#zAccent)">Membangun Startup Masa Depan</text>

  <text x="60" y="475" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="400" fill="#a1a1aa">
    <tspan x="60" dy="0">Catatan Filosofis Mengenai Cara Membangun Monopoli Positif</tspan>
    <tspan x="60" dy="24">dan Menemukan Rahasia Tersembunyi di Dunia Teknologi.</tspan>
  </text>

  <rect x="60" y="545" width="80" height="4" rx="2" fill="url(#zAccent)" />

  <g transform="translate(60, 660)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#71717a" letter-spacing="2">PENULIS</text>
    <text x="0" y="24" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="700" fill="#f4f4f5">Peter Thiel</text>
  </g>

  <g transform="translate(450, 680)">
    <text x="90" y="0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="end" letter-spacing="1">Bookil<tspan fill="#f59e0b">.</tspan></text>
    <text x="90" y="16" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="600" fill="#71717a" text-anchor="end" letter-spacing="1">EDISI RESMI</text>
  </g>
</svg>
