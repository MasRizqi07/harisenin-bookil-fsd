<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="reactBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#083344" />
    </linearGradient>
    <linearGradient id="reactAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <linearGradient id="spine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="600" height="800" fill="url(#reactBg)" />
  <rect x="0" y="0" width="30" height="800" fill="url(#spine)" />
  <line x1="30" y1="0" x2="30" y2="800" stroke="#1e293b" stroke-width="1" />

  <!-- React Orbits -->
  <g transform="translate(300, 390)" opacity="0.12" stroke="#22d3ee" stroke-width="2" fill="none">
    <ellipse rx="160" ry="60" transform="rotate(30)" />
    <ellipse rx="160" ry="60" transform="rotate(90)" />
    <ellipse rx="160" ry="60" transform="rotate(150)" />
    <circle r="16" fill="#22d3ee" />
  </g>

  <g transform="translate(60, 60)">
    <rect width="160" height="30" rx="15" fill="#155e75" opacity="0.8" />
    <text x="80" y="20" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#a5f3fc" text-anchor="middle" letter-spacing="1">FULL-STACK MONOLITH</text>
  </g>

  <text x="60" y="290" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="600" fill="#22d3ee" letter-spacing="4">MODERN FRONTEND ARCHITECTURE</text>
  <text x="60" y="350" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-1">Building Modern Web</text>
  <text x="60" y="405" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="44" font-weight="800" fill="url(#reactAccent)" letter-spacing="-1">React 19 &amp; Inertia v2</text>

  <text x="60" y="465" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="400" fill="#94a3b8">
    <tspan x="60" dy="0">Panduan Mutakhir Memadukan SSR, Hydration Cepat,</tspan>
    <tspan x="60" dy="24">dan Full Type-Safe Inertia Form Handlers.</tspan>
  </text>

  <rect x="60" y="535" width="80" height="4" rx="2" fill="url(#reactAccent)" />

  <g transform="translate(60, 660)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="2">PENULIS</text>
    <text x="0" y="24" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">Dan Abramov &amp; Friends</text>
  </g>

  <g transform="translate(450, 680)">
    <text x="90" y="0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="end" letter-spacing="1">Bookil<tspan fill="#06b6d4">.</tspan></text>
    <text x="90" y="16" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="600" fill="#64748b" text-anchor="end" letter-spacing="1">PRESS 2026</text>
  </g>
</svg>
