<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="dwBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="dwAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
    <linearGradient id="spine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="600" height="800" fill="url(#dwBg)" />
  <rect x="0" y="0" width="30" height="800" fill="url(#spine)" />
  <line x1="30" y1="0" x2="30" y2="800" stroke="#3f3f46" stroke-width="1" />

  <g transform="translate(60, 60)">
    <rect width="180" height="30" rx="15" fill="#881337" opacity="0.8" />
    <text x="90" y="20" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#fecdd3" text-anchor="middle" letter-spacing="1">FOKUS &amp; PRODUKTIVITAS</text>
  </g>

  <text x="60" y="290" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="600" fill="#fb7185" letter-spacing="4">PROFESSIONAL MASTERY</text>
  <text x="60" y="350" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="56" font-weight="900" fill="#ffffff" letter-spacing="-1">Deep Work</text>
  <text x="60" y="405" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="700" fill="url(#dwAccent)">Sukses di Dunia Penuh Gangguan</text>

  <text x="60" y="465" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="400" fill="#a1a1aa">
    <tspan x="60" dy="0">Aturan Praktis Melatih Daya Konsentrasi Maksimal</tspan>
    <tspan x="60" dy="24">untuk Menghasilkan Nilai Langka di Era Distraksi.</tspan>
  </text>

  <rect x="60" y="535" width="80" height="4" rx="2" fill="url(#dwAccent)" />

  <g transform="translate(60, 660)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#71717a" letter-spacing="2">PENULIS</text>
    <text x="0" y="24" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="700" fill="#fafafa">Cal Newport</text>
  </g>

  <g transform="translate(450, 680)">
    <text x="90" y="0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="end" letter-spacing="1">Bookil<tspan fill="#f43f5e">.</tspan></text>
    <text x="90" y="16" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="600" fill="#71717a" text-anchor="end" letter-spacing="1">FOCUS 2026</text>
  </g>
</svg>
