<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="lsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="lsAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <linearGradient id="spine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="600" height="800" fill="url(#lsBg)" />
  <rect x="0" y="0" width="30" height="800" fill="url(#spine)" />
  <line x1="30" y1="0" x2="30" y2="800" stroke="#064e3b" stroke-width="1" />

  <!-- Circular Arrow Decor -->
  <g transform="translate(300, 390)" opacity="0.12" stroke="#10b981" stroke-width="3" fill="none">
    <circle r="140" stroke-dasharray="16 8" />
    <polygon points="140,0 155,-20 125,-20" fill="#10b981" />
  </g>

  <g transform="translate(60, 60)">
    <rect width="180" height="30" rx="15" fill="#064e3b" opacity="0.8" />
    <text x="90" y="20" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#6ee7b7" text-anchor="middle" letter-spacing="1">AGILE METHODOLOGY</text>
  </g>

  <text x="60" y="290" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="600" fill="#34d399" letter-spacing="4">INNOVATION MANAGEMENT</text>
  <text x="60" y="350" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="50" font-weight="900" fill="#ffffff" letter-spacing="-1">The Lean Startup</text>
  <text x="60" y="405" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="24" font-weight="700" fill="url(#lsAccent)">Validasi Cepat Produk Digital</text>

  <text x="60" y="465" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="400" fill="#9ca3af">
    <tspan x="60" dy="0">Prinsip Build-Measure-Learn untuk Memangkas</tspan>
    <tspan x="60" dy="24">Pemborosan dan Menemukan Product-Market Fit.</tspan>
  </text>

  <rect x="60" y="535" width="80" height="4" rx="2" fill="url(#lsAccent)" />

  <g transform="translate(60, 660)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#6b7280" letter-spacing="2">PENULIS</text>
    <text x="0" y="24" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="700" fill="#f3f4f6">Eric Ries</text>
  </g>

  <g transform="translate(450, 680)">
    <text x="90" y="0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="end" letter-spacing="1">Bookil<tspan fill="#10b981">.</tspan></text>
    <text x="90" y="16" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="600" fill="#6b7280" text-anchor="end" letter-spacing="1">BUSINESS 2026</text>
  </g>
</svg>
