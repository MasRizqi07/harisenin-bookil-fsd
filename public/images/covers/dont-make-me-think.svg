<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="dmmtBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#450a0a" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="dmmtAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <linearGradient id="spine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="600" height="800" fill="url(#dmmtBg)" />
  <rect x="0" y="0" width="30" height="800" fill="url(#spine)" />
  <line x1="30" y1="0" x2="30" y2="800" stroke="#7f1d1d" stroke-width="1" />

  <g transform="translate(60, 60)">
    <rect width="180" height="30" rx="15" fill="#7f1d1d" opacity="0.8" />
    <text x="90" y="20" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#fca5a5" text-anchor="middle" letter-spacing="1">USABILITY PRINCIPLES</text>
  </g>

  <text x="60" y="290" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="600" fill="#f87171" letter-spacing="4">WEB &amp; MOBILE USABILITY</text>
  <text x="60" y="340" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="48" font-weight="900" fill="#ffffff" letter-spacing="-1">Don't Make</text>
  <text x="60" y="390" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="48" font-weight="900" fill="url(#dmmtAccent)" letter-spacing="-1">Me Think</text>
  <text x="60" y="440" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Desain UX Intuitif</text>

  <text x="60" y="495" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="400" fill="#d1d5db">
    <tspan x="60" dy="0">Prinsip Emas Desain Antarmuka: Membuat Pengguna</tspan>
    <tspan x="60" dy="24">Menemukan Tujuan Mereka Tanpa Perlu Berpikir Keras.</tspan>
  </text>

  <rect x="60" y="560" width="80" height="4" rx="2" fill="url(#dmmtAccent)" />

  <g transform="translate(60, 660)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#9ca3af" letter-spacing="2">PENULIS</text>
    <text x="0" y="24" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Steve Krug</text>
  </g>

  <g transform="translate(450, 680)">
    <text x="90" y="0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="end" letter-spacing="1">Bookil<tspan fill="#ef4444">.</tspan></text>
    <text x="90" y="16" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="600" fill="#9ca3af" text-anchor="end" letter-spacing="1">UX CLASSIC</text>
  </g>
