name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bookil_test
          POSTGRES_USER: bookil
          POSTGRES_PASSWORD: bookil_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bookil -d bookil_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: bookil_test
      DB_USERNAME: bookil
      DB_PASSWORD: bookil_test_only
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: bcmath, fileinfo, mbstring, pdo_pgsql
          coverage: none
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare application key
        run: |
          cp .env.example .env
          php artisan key:generate --force
      - name: Check PHP formatting
        run: vendor/bin/pint --test
      - name: Run PHP tests
        run: php artisan test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
